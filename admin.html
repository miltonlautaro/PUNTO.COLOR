<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Punto Color — Panel de pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --kraft:#f5e8d0; --ink:#1a1009; --accent:#e8453c; --ok:#2ec4b6; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Nunito',sans-serif;background:var(--kraft);color:var(--ink);min-height:100vh}
  header{background:var(--ink);color:#f5e8cf;padding:18px 24px;font-family:'Fredoka One',sans-serif;font-size:1.3rem}
  header span{color:#ff8a75}
  main{max-width:1000px;margin:0 auto;padding:24px}

  #login-box{max-width:360px;margin:60px auto;background:#fff;border-radius:16px;padding:32px;box-shadow:0 10px 30px rgba(26,16,9,.12);text-align:center}
  #login-box h2{font-family:'Fredoka One',sans-serif;font-size:1.1rem;margin:0 0 20px}
  #login-box input{width:100%;padding:12px;margin-bottom:12px;border:1px solid #ddd;border-radius:10px;font-family:'Nunito',sans-serif;font-size:.95rem}
  #login-box button{width:100%;padding:12px;background:var(--ink);color:#f5e8cf;border:none;border-radius:30px;font-family:'Fredoka One',sans-serif;font-size:.9rem;cursor:pointer}
  #login-msg{color:var(--accent);font-size:.85rem;margin-top:10px;min-height:18px}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .toolbar button{background:none;border:1px solid var(--ink);color:var(--ink);padding:8px 16px;border-radius:20px;font-family:'Nunito',sans-serif;font-weight:700;font-size:.85rem;cursor:pointer}

  .pedido-card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 6px 20px rgba(26,16,9,.08)}
  .pedido-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:10px}
  .pedido-id{font-family:'Fredoka One',sans-serif;font-size:.95rem}
  .estado-badge{font-size:.75rem;font-weight:800;padding:4px 12px;border-radius:20px;text-transform:uppercase}
  .estado-pendiente{background:#fde3b0;color:#7a4a00}
  .estado-pagado{background:#cdeee9;color:#166b62}
  .estado-completado{background:#dcecc9;color:#3f6b1f}

  .pedido-info{font-size:.85rem;line-height:1.6;color:#4a2e0a;margin-bottom:12px}
  .pedido-info strong{color:var(--ink)}

  .entrega-box{background:var(--kraft);border-radius:12px;padding:12px 16px;margin-bottom:12px;font-size:.9rem;line-height:1.5}
  .entrega-box .dir-principal{font-weight:800;font-size:1rem;color:var(--ink)}
  .entrega-box .dir-zona{font-size:.78rem;color:#7a5a2a;font-weight:700}
  .entrega-box .dir-ref{font-style:italic;color:#7a5a2a;font-size:.82rem}

  .total-grupo{font-family:'Fredoka One',sans-serif;font-size:1.15rem;color:var(--ink);margin-bottom:12px}

  .item-section{border:1px solid rgba(160,110,40,.25);border-radius:12px;padding:14px;margin-bottom:10px}
  .item-section .item-titulo{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#7a5a2a;margin-bottom:8px}

  .specs-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .spec-chip{
    background:var(--kraft);border:1.5px solid rgba(160,110,40,.35);border-radius:10px;
    padding:6px 12px;font-weight:800;font-size:.9rem;color:var(--ink);
  }
  /* Los dos descuidos más caros al armar un pedido: color y copias extra */
  .spec-chip.destacado{background:#fde9e7;border-color:var(--accent);color:#a02318}

  .archivos-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .archivo-item{display:flex;gap:4px;align-items:center}
  .archivos-list a{
    background:var(--kraft);color:var(--ink);text-decoration:none;font-size:.8rem;font-weight:700;
    padding:6px 12px;border-radius:20px 0 0 20px;
  }
  .imprimir-btn{
    background:var(--ink);color:#f5e8cf;border:none;font-size:.8rem;font-weight:700;
    padding:6px 12px;border-radius:0 20px 20px 0;cursor:pointer;font-family:'Nunito',sans-serif;
  }
  .imprimir-btn:disabled{opacity:.5;cursor:default}
  .archivos-list .sin-archivos{color:#999;font-style:italic;font-size:.8rem}

  .completar-btn{
    background:var(--ok);color:#fff;border:none;padding:8px 18px;border-radius:20px;
    font-family:'Fredoka One',sans-serif;font-size:.8rem;cursor:pointer;
  }
  .completar-btn:disabled{opacity:.5;cursor:default}

  /* Pestañas: el panel pasó de una sola vista a varias secciones */
  .tabs{display:flex;gap:8px}
  .toolbar-acciones{display:flex;gap:8px}
  .tab-btn.active{background:var(--ink);color:#f5e8cf}

  /* Códigos promocionales */
  .estado-activo{background:#cdeee9;color:#166b62}
  .estado-inactivo{background:#e8e2d6;color:#7a6a52}
  .cod-form{background:#fff;border-radius:16px;padding:18px 20px;margin-bottom:18px;box-shadow:0 6px 20px rgba(26,16,9,.08)}
  .cod-form-title{font-family:'Fredoka One',sans-serif;font-size:.95rem;margin-bottom:12px}
  .cod-form-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .cod-form-row input,.cod-form-row select{
    padding:9px 12px;border:1px solid #ddd;border-radius:10px;
    font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;
  }
  #cod-codigo{width:150px;text-transform:uppercase;letter-spacing:.04em}
  #cod-valor{width:100px}
  #cod-desc{flex:1;min-width:170px;font-weight:400}
  .cod-msg{font-size:.82rem;font-weight:700;margin-top:10px;display:none}
  .cod-msg.show{display:block}
  .cod-msg.ok{color:var(--ok)}
  .cod-msg.err{color:var(--accent)}
  .cod-info{font-size:.85rem;line-height:1.6;color:#4a2e0a;margin-bottom:12px}
  .cod-info strong{color:var(--ink)}
  .desactivar-btn{
    background:var(--accent);color:#fff;border:none;padding:8px 18px;border-radius:20px;
    font-family:'Fredoka One',sans-serif;font-size:.8rem;cursor:pointer;
  }
  .desactivar-btn:disabled{opacity:.5;cursor:default}

  #estado-carga, #estado-vacio, #codigos-carga, #codigos-vacio{text-align:center;padding:60px 0;color:#7a5a2a}
  #app{display:none}
</style>
</head>
<body>

<header>Punto <span>Color</span> — Panel de pedidos</header>

<main>
  <div id="login-box">
    <h2>Iniciá sesión</h2>
    <input id="login-email" type="email" placeholder="Email">
    <input id="login-pass" type="password" placeholder="Contraseña">
    <button onclick="login()">Entrar</button>
    <div id="login-msg"></div>
  </div>

  <div id="app">
    <div class="toolbar">
      <div class="tabs">
        <button class="tab-btn active" id="tab-pedidos" onclick="mostrarSeccion('pedidos')">📦 Pedidos</button>
        <button class="tab-btn" id="tab-codigos" onclick="mostrarSeccion('codigos')">🏷️ Códigos</button>
      </div>
      <div class="toolbar-acciones">
        <button onclick="actualizarSeccion()">↻ Actualizar</button>
        <button onclick="logout()">Cerrar sesión</button>
      </div>
    </div>

    <div id="sec-pedidos">
      <div id="estado-carga">Cargando pedidos...</div>
      <div id="estado-vacio" style="display:none">No hay pedidos todavía.</div>
      <div id="pedidos-list"></div>
    </div>

    <div id="sec-codigos" hidden>
      <div class="cod-form">
        <div class="cod-form-title">Nuevo código promocional</div>
        <div class="cod-form-row">
          <input id="cod-codigo" placeholder="PROMO20" maxlength="32" autocomplete="off">
          <select id="cod-tipo">
            <option value="porcentaje">% de descuento</option>
            <option value="monto">$ fijo</option>
          </select>
          <input id="cod-valor" type="number" min="1" placeholder="20">
          <input id="cod-desc" placeholder="Descripción (opcional)" maxlength="80" autocomplete="off">
          <button class="completar-btn" onclick="crearCodigo(this)">+ Crear</button>
        </div>
        <div class="cod-msg" id="cod-msg"></div>
      </div>
      <div id="codigos-carga">Cargando códigos...</div>
      <div id="codigos-vacio" style="display:none">No hay códigos cargados.</div>
      <div id="codigos-list"></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const PC_SERVER = 'https://api.puntocolorimpresiones.com';
const sb = supabase.createClient(
  'https://bdezjzqizywgyumpspdi.supabase.co',
  'sb_publishable_PBFkAWpGBQ2ZMcYg_H4zPQ_HpnZlvbd'
);

function fmtFecha(iso){
  return new Date(iso).toLocaleString('es-AR', { dateStyle:'short', timeStyle:'short' });
}
function fmtMoney(n){
  return n == null ? '—' : '$ ' + Number(n).toLocaleString('es-AR');
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

async function getToken(){
  const { data } = await sb.auth.getSession();
  return data?.session?.access_token || null;
}

// Fetch autenticado contra el panel. Si el servidor responde que la cuenta no
// es admin, cierra la sesión y devuelve null — quien llama solo tiene que
// cortar. El panel nunca lee is_admin por su cuenta: se entera por el 403.
async function fetchAdmin(path, opts = {}){
  const token = await getToken();
  const res = await fetch(PC_SERVER + path, {
    ...opts,
    headers: { ...(opts.headers || {}), 'Authorization': 'Bearer ' + token },
  });
  if (res.status === 401 || res.status === 403) {
    document.getElementById('login-msg').textContent = 'No tenés permisos de administrador para esta cuenta';
    await logout();
    return null;
  }
  return res;
}

// ── Secciones del panel ──────────────────────────────────────────────────────
// Cada sección se carga la primera vez que se abre, no todas al entrar.
let seccionActual = 'pedidos';
const seccionesCargadas = {};

function mostrarSeccion(sec){
  seccionActual = sec;
  ['pedidos','codigos'].forEach(function(s){
    document.getElementById('sec-' + s).hidden = (s !== sec);
    document.getElementById('tab-' + s).classList.toggle('active', s === sec);
  });
  if (!seccionesCargadas[sec]) actualizarSeccion();
}

function actualizarSeccion(){
  seccionesCargadas[seccionActual] = true;
  if (seccionActual === 'codigos') return cargarCodigos();
  return cargarPedidos();
}

async function login(){
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const msgEl = document.getElementById('login-msg');
  msgEl.textContent = '';
  if (!email || !pass) { msgEl.textContent = 'Completá email y contraseña'; return; }

  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { msgEl.textContent = 'Credenciales incorrectas'; return; }
  await mostrarApp();
}

async function logout(){
  await sb.auth.signOut();
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-box').style.display = 'block';
}

async function mostrarApp(){
  document.getElementById('login-box').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  seccionActual = 'pedidos';
  seccionesCargadas.pedidos = true;
  await cargarPedidos();
}

async function cargarPedidos(){
  const listEl   = document.getElementById('pedidos-list');
  const cargaEl  = document.getElementById('estado-carga');
  const vacioEl  = document.getElementById('estado-vacio');
  listEl.innerHTML = '';
  cargaEl.style.display = 'block';
  vacioEl.style.display = 'none';

  try {
    const res = await fetchAdmin('/admin/pedidos');
    if (!res) { cargaEl.style.display = 'none'; return; }
    const data = await res.json();
    cargaEl.style.display = 'none';
    if (!data.pedidos || data.pedidos.length === 0) {
      vacioEl.style.display = 'block';
      return;
    }
    // Agrupar por pago: cada ítem de un carrito es una fila propia en la DB,
    // pero comparten pedido_grupo_id (y el total del grupo repetido). Filas
    // viejas sin grupo se tratan como grupo de un solo ítem.
    const grupos = new Map();
    data.pedidos.forEach(p => {
      const clave = p.pedido_grupo_id || p.pedido_id;
      if (!grupos.has(clave)) grupos.set(clave, []);
      grupos.get(clave).push(p);
    });
    grupos.forEach((items, clave) => listEl.appendChild(renderGrupo(clave, items)));
  } catch (err) {
    cargaEl.textContent = 'Error al cargar pedidos. Reintentá con el botón Actualizar.';
  }
}

// ¿El "2 páginas por cara" que eligió el cliente tiene algún efecto real?
// Cada archivo arranca en una hoja nueva, así que con archivos de una sola
// página no junta nada ni abarata: pages > cantidad de archivos significa
// que al menos uno tiene 2+ páginas. Si no sabemos las páginas, devolvemos
// true para no ocultarle al operador un 2-up que sí es real.
function aplicaDosPorCara(p){
  if (p.pages == null) return true;
  const archivos = Array.isArray(p.archivos) ? p.archivos.length : 1;
  return Number(p.pages) > archivos;
}

function chipsSpecs(p){
  const config = p.config || {};
  const chips = [];
  // tinta color y copias extra son los dos descuidos más caros al armar
  if (config.tinta)   chips.push({ txt: config.tinta,               destacar: config.tinta === 'color' });
  if (config.cara)    chips.push({ txt: config.cara,                destacar: false });
  // 2 páginas por cara cambia por completo cómo se arma el documento, pero
  // solo se muestra cuando REALMENTE se aplica. Cada archivo arranca en una
  // hoja nueva, así que si todos tienen una sola página la opción queda
  // inerte (ni junta páginas ni cambia el precio) y mostrarla confunde.
  // pages > cantidad de archivos  =>  al menos un archivo tiene 2+ páginas.
  // Es "por cara", no por hoja: con doble faz son 2 por cara = 4 por hoja.
  if (String(config.ppc) === '2' && aplicaDosPorCara(p)) {
    chips.push({ txt: '2 págs por cara', destacar: true });
  }
  if (config.acabado) chips.push({ txt: config.acabado,             destacar: false });
  if (p.copies)       chips.push({ txt: `${p.copies} copia(s)`,     destacar: Number(p.copies) > 1 });
  if (p.hojas)        chips.push({ txt: `${p.hojas} hoja(s)`,       destacar: false });
  if (chips.length === 0) return '<span class="sin-archivos">Sin especificaciones</span>';
  return chips.map(c =>
    `<span class="spec-chip${c.destacar ? ' destacado' : ''}">${escapeHtml(c.txt)}</span>`
  ).join('');
}

function archivosHtmlDe(p, pedidoIds, estado){
  return (p.archivosStorage && p.archivosStorage.length > 0)
    ? p.archivosStorage.map(a => `
        <span class="archivo-item">
          <a href="${a.url || '#'}" target="_blank" rel="noopener">⬇ ${escapeHtml(a.nombre)}</a>
          <button class="imprimir-btn" ${a.url ? '' : 'disabled'}
            onclick='imprimirArchivo(${JSON.stringify(a.url)}, ${JSON.stringify(pedidoIds)}, ${JSON.stringify(estado)}, this)'>🖨️</button>
        </span>
      `).join('')
    : '<span class="sin-archivos">Sin archivos</span>';
}

function renderGrupo(clave, items){
  const div = document.createElement('div');
  div.className = 'pedido-card';

  const primera = items[0];
  const estado = primera.estado || 'pendiente';
  const estadoClass = 'estado-' + estado;
  const pedidoIds = items.map(p => p.pedido_id);

  // Dirección de entrega — dato principal; zona como secundario
  const dir = primera.direccion || {};
  const calle = [dir.calle, dir.altura].filter(Boolean).join(' ');
  const extraDir = [dir.piso && `piso ${dir.piso}`, dir.depto && `depto ${dir.depto}`].filter(Boolean).join(', ');
  const zonaName = (primera.zona && primera.zona.name) || null;
  const entregaHtml = `
    <div class="entrega-box">
      <span class="dir-principal">📍 ${escapeHtml(calle || 'Sin dirección')}${extraDir ? ' — ' + escapeHtml(extraDir) : ''}</span>
      ${zonaName ? ` <span class="dir-zona">(${escapeHtml(zonaName)})</span>` : ''}
      ${dir.referencia ? `<br><span class="dir-ref">"${escapeHtml(dir.referencia)}"</span>` : ''}
    </div>`;

  const itemsHtml = items.map((p, i) => `
    <div class="item-section">
      <div class="item-titulo">${items.length > 1 ? `Ítem ${i + 1} de ${items.length} · ` : ''}${escapeHtml(p.pedido_id)}</div>
      <div class="specs-chips">${chipsSpecs(p)}</div>
      <div class="archivos-list">${archivosHtmlDe(p, pedidoIds, estado)}</div>
    </div>`).join('');

  div.innerHTML = `
    <div class="pedido-head">
      <div class="pedido-id">${escapeHtml(clave)}</div>
      <div class="estado-badge ${estadoClass}">${escapeHtml(estado)}</div>
    </div>
    <div class="pedido-info">
      <strong>Fecha:</strong> ${fmtFecha(primera.created_at)}<br>
      <strong>Cliente:</strong> ${escapeHtml(primera.email || '—')} ${primera.whatsapp ? '· ' + escapeHtml(primera.whatsapp) : ''}
    </div>
    ${entregaHtml}
    <div class="total-grupo">Total: ${fmtMoney(primera.total)}</div>
    ${itemsHtml}
  `;

  if (estado === 'pagado') {
    const btn = document.createElement('button');
    btn.className = 'completar-btn';
    btn.textContent = '✓ Marcar como completado';
    btn.onclick = () => completarGrupo(pedidoIds, btn);
    div.appendChild(btn);
  }

  return div;
}

// Completa TODAS las filas del grupo (el endpoint es por pedido_id — se
// llama una vez por ítem; N es chico, siempre ≤ 10 ítems por carrito).
async function completarGrupo(pedidoIds, btnEl){
  if (btnEl) { btnEl.disabled = true; btnEl.textContent = 'Actualizando...'; }
  const token = await getToken();
  try {
    for (const pedidoId of pedidoIds) {
      const res = await fetch(PC_SERVER + '/admin/pedidos/' + encodeURIComponent(pedidoId) + '/completar', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (!res.ok) throw new Error();
    }
    await cargarPedidos();
  } catch (err) {
    if (btnEl) { btnEl.disabled = false; btnEl.textContent = '✓ Marcar como completado'; }
    alert('No se pudo actualizar el pedido. Reintentá.');
  }
}

// ── Códigos promocionales ────────────────────────────────────────────────────
async function cargarCodigos(){
  const listEl  = document.getElementById('codigos-list');
  const cargaEl = document.getElementById('codigos-carga');
  const vacioEl = document.getElementById('codigos-vacio');
  listEl.innerHTML = '';
  cargaEl.textContent = 'Cargando códigos...';
  cargaEl.style.display = 'block';
  vacioEl.style.display = 'none';

  try {
    const res = await fetchAdmin('/admin/codigos');
    if (!res) { cargaEl.style.display = 'none'; return; }
    const data = await res.json();
    cargaEl.style.display = 'none';
    if (!data.codigos || data.codigos.length === 0) {
      vacioEl.style.display = 'block';
      return;
    }
    data.codigos.forEach(c => listEl.appendChild(renderCodigo(c)));
  } catch (err) {
    cargaEl.textContent = 'Error al cargar los códigos. Reintentá con el botón Actualizar.';
  }
}

function renderCodigo(c){
  const div = document.createElement('div');
  div.className = 'pedido-card';
  const valorTxt = c.tipo === 'porcentaje'
    ? c.valor + '% de descuento'
    : fmtMoney(c.valor) + ' de descuento';

  div.innerHTML = `
    <div class="pedido-head">
      <div class="pedido-id">${escapeHtml(c.codigo)}</div>
      <div class="estado-badge ${c.activo ? 'estado-activo' : 'estado-inactivo'}">${c.activo ? 'activo' : 'inactivo'}</div>
    </div>
    <div class="cod-info">
      <strong>${escapeHtml(valorTxt)}</strong><br>
      ${c.descripcion ? escapeHtml(c.descripcion) + '<br>' : ''}
      Usado ${c.usos} ${c.usos === 1 ? 'vez' : 'veces'} · creado ${fmtFecha(c.created_at)}
    </div>
  `;

  const btn = document.createElement('button');
  btn.className = c.activo ? 'desactivar-btn' : 'completar-btn';
  btn.textContent = c.activo ? 'Desactivar' : 'Activar';
  btn.onclick = () => cambiarEstadoCodigo(c.codigo, !c.activo, btn);
  div.appendChild(btn);
  return div;
}

async function cambiarEstadoCodigo(codigo, activo, btnEl){
  const original = btnEl.textContent;
  btnEl.disabled = true;
  btnEl.textContent = 'Guardando...';
  try {
    const res = await fetchAdmin('/admin/codigos/' + encodeURIComponent(codigo) + '/estado', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ activo }),
    });
    if (!res) return;
    if (!res.ok) throw new Error();
    await cargarCodigos();
  } catch (err) {
    btnEl.disabled = false;
    btnEl.textContent = original;
    alert('No se pudo cambiar el estado del código. Reintentá.');
  }
}

async function crearCodigo(btnEl){
  const msgEl = document.getElementById('cod-msg');
  const mostrar = (texto, clase) => { msgEl.textContent = texto; msgEl.className = 'cod-msg show ' + clase; };

  const codigo      = document.getElementById('cod-codigo').value.trim().toUpperCase();
  const tipo        = document.getElementById('cod-tipo').value;
  const valor       = document.getElementById('cod-valor').value;
  const descripcion = document.getElementById('cod-desc').value.trim();

  if (!codigo || !valor) { mostrar('Completá el código y el valor.', 'err'); return; }

  btnEl.disabled = true;
  try {
    const res = await fetchAdmin('/admin/codigos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ codigo, tipo, valor: Number(valor), descripcion }),
    });
    if (!res) return;
    const data = await res.json();
    if (!res.ok) { mostrar(data.error || 'No se pudo crear el código.', 'err'); return; }

    mostrar('Código ' + codigo + ' creado.', 'ok');
    document.getElementById('cod-codigo').value = '';
    document.getElementById('cod-valor').value  = '';
    document.getElementById('cod-desc').value   = '';
    await cargarCodigos();
  } catch (err) {
    mostrar('No pudimos conectar con el servidor. Reintentá.', 'err');
  } finally {
    btnEl.disabled = false;
  }
}

// Abre el PDF en una pestaña propia (mismo origen, vía blob) para poder
// disparar window.print() y escuchar 'afterprint' — un PDF cross-origin
// (el signed URL de Supabase) no permite ninguna de las dos cosas.
async function imprimirArchivo(url, pedidoIds, estadoActual, btnEl){
  if (!url) return;
  btnEl.disabled = true;
  const originalText = btnEl.textContent;
  btnEl.textContent = '...';
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error();
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    const w = window.open(blobUrl, '_blank');
    if (!w) {
      alert('El navegador bloqueó la ventana de impresión. Permití pop-ups para este sitio.');
      return;
    }
    w.addEventListener('load', () => {
      setTimeout(() => { try { w.print(); } catch(e){} }, 300);
    });
    // afterprint se dispara al cerrar el diálogo, imprima o cancele el
    // usuario — el navegador no expone cuál de las dos pasó. Por eso
    // preguntamos explícitamente antes de marcar el pedido como completado.
    // El confirm completa el GRUPO entero: si quedan archivos por imprimir,
    // responder Cancelar y completar después con el botón de la tarjeta.
    w.addEventListener('afterprint', () => {
      URL.revokeObjectURL(blobUrl);
      if (estadoActual === 'pagado' && confirm('¿Se imprimió todo el pedido correctamente? (Se marca completo el pedido entero)')) {
        completarGrupo(pedidoIds);
      }
    });
  } catch (err) {
    alert('No se pudo abrir el archivo para imprimir.');
  } finally {
    btnEl.disabled = false;
    btnEl.textContent = originalText;
  }
}

(async function init(){
  const { data } = await sb.auth.getSession();
  if (data?.session) await mostrarApp();
})();
</script>
